; real_quad 1.0 - settings.
; Change a value, save, restart the game - or change it in Pause > Mods with
; mod_settings. Delete a line to use the default. Updates keep what you
; change here (settings.default.cfg has the defaults).
; real_quad/status.txt shows whether it is in effect and the drone in use.

[mod]

; real_quad is off until you set this to true.
enabled=false

[real_quad]

; The prop wash of a quad a model flies is dirty_air's (its wake, gusts,
; descent and ring state go into the model's props, with the wash, wake and
; gust its package was calibrated with); without dirty_air it flies in clean
; air. With dirty_air the floor under the props also gives each prop more
; thrust and a ceiling over them pulls them up (dirty_air's ground_effect and
; ceiling_effect, set there). false = no floor or ceiling effect on modelled
; quads (the prop wash stays).
ground_ceiling_effect=true

; The pack a model flies on is battery_sag's (drained by the model's motors;
; without battery_sag it sags but does not drain), of the size its package
; gives (craft.json "battery"). This is the size for a package that does not.
battery_capacity_mah=1300

; The models were made and tried with one version of the game. After a game
; update real_quad stays out (the game runs as without it) until it has been
; updated. true = try the models on the new version anyway, if the game's quad
; script still has everything they need - it may fly wrongly, or not at all.
unknown_game_version=false

;; ---- Drones ----
; Which flight model flies each of the game's quads, and how strong its prop
; wash and drag are. A quad with no model made for it, or set to "off", is
; flown by the game's own physics (or flight_controller's, if it is in
; effect). The models are the folders in real_quad/models; any model can fly
; any drone (the drone's weight, thrust and top speed are then the model's, and
; the game's Physics menu has no effect on them; its camera settings, rates, drag
; multipliers and wind do apply).

; 65mm Whoop.
[65mm_freestyle]

; The flight model for this drone: "auto" = the model made for it (none:
; the game's physics), "off" = the game's own physics, or a model's name:
; "freestyle5" (a 5-inch quad, 650 g, 6S, 4 kHz loop; made for the 5-inch Freestyle) or
; "freestyle35" (a 3.5-inch quad, 300 g, 4S, 8 kHz loop; made for the 3.5-inch Freestyle),
; see README.txt.
model="auto"

; Where the sticks' rates come from: "game" = the game's own Rates (Pause > Rates,
; any of its types: Actual, Betaflight, KISS; changes count at once), "model" =
; the rates of the model's own Betaflight setup (its fc.json).
rates="game"

; Which Betaflight tune the model flies: "flown" = the one of the real quad's
; logs (fc.json), "optimized" = the model's optimized tune (made by its build,
; simulator only: how the quad would probably fly when well tuned). A model
; without one, or whose one is out of date, flies the flown tune (the status
; line says so). Changes count at once.
tune="flown"

; How strong the prop wash is, as a multiple of what the model was calibrated
; to from real flights: 1 = as flown, 0 = none, 2 = twice that. Needs
; dirty_air (without it: none).
propwash=1.0

; The drag the props put on the quad flying across them, as the share of its
; sideways speed it loses each second hovering (1/s): a tuning knob, as
; the logs cannot tell it (the top speed hardly depends on it). More = it
; stops sooner after a turn or a punch. 0 = the model's own (freestyle5: 0.5, freestyle35: 0.35).
drag=0

; 85mm Whoop.
[85mm_freestyle]

; The flight model: "auto" = the model made for this drone (none: the game's
; physics), "off" = the game's own physics, or a model's name: "freestyle5",
; "freestyle35" (see README.txt).
model="auto"

; Where the sticks' rates come from: "game" = the game's own Rates, "model" =
; the model's own.
rates="game"

; Which tune flies: "flown" = the real quad's, "optimized" = the model's
; optimized tune.
tune="flown"
propwash=1.0
drag=0

